[workspace]

[package]
name = "mokosh-client"
version = "0.1.0"
edition = "2021"
authors = ["Mokosh Platform Team"]
description = "Mokosh Platform - Cross-platform Dioxus client"
license = "Proprietary"
repository = "https://github.com/your-org/mokosh-platform"

[[bin]]
name = "mokosh-client"
path = "src/main.rs"

[features]
default = ["web", "multi-tenant"]
web = []
multi-tenant = []
single-tenant = []

[lib]
name = "mokosh_client"
path = "src/lib.rs"

[dependencies]
# Dioxus framework
dioxus = { version = "0.7.2", features = ["router", "web"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.11", features = ["v4", "v7", "serde", "js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

# Date/Time
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Validation
validator = { version = "0.19", features = ["derive"] }

# Error handling
thiserror = "2"

# Logging/Tracing
tracing = "0.1"

# WASM-friendly HTTP client
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "Navigator", "Location", "UrlSearchParams"] }
js-sys = "0.3"

# OIDC / PKCE primitives (SPA public-client flow against mokosh-server)
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

# Markdown rendering
pulldown-cmark = "0.12"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
