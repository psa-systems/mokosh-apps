[workspace]

[package]
name = "mokosh-apps"
version = "0.10.0"
edition = "2021"
authors = ["Mokosh Platform Team"]
description = "Mokosh Platform - Cross-platform Dioxus client"
license = "Proprietary"
repository = "https://dev.a8n.run/psa-systems/mokosh-apps"

[[bin]]
name = "mokosh-apps"
path = "src/main.rs"

[features]
default = [
    "web",
    "multi-tenant",
]
web = []
multi-tenant = []
single-tenant = []
server = []
# MAPPS-338: opt-in dev shortcut that auto-signs the WASM in as Admin
# from `ADMIN_EMAIL` + `ADMIN_PASSWORD` compile-time env. Off by default
# even in debug builds so a debug WASM that ships to staging by accident
# does not auto-grant Admin. Flip on locally via
# `cargo run --features dev_admin_bypass` (and set the env vars).
dev_admin_bypass = []

[lib]
name = "mokosh_apps"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
gloo-net = "0.6"
futures-util = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
# MAPPS-299: forward Rust panics in the wasm runtime to console.error with
# a readable message + stack trace. Without this a panic surfaces as an
# opaque `RuntimeError: unreachable` at a hex offset (e.g. wasm:0x352c4f)
# the user has no way to act on. The hook is install-once at startup.
console_error_panic_hook = "0.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
pulldown-cmark = "0.12"
ammonia = "4"
# MAPPS-383: shared wire-format DTOs, the single source of truth for types
# crossing the mokosh-server / mokosh-apps boundary. The URL is HTTPS, not
# ssh://, because the pre-commit container and the Forgejo check runner have
# no SSH credentials; anonymous HTTPS read needs none. The exact commit is
# pinned in Cargo.lock.
[dependencies.mokosh-types]
git = "https://dev.a8n.run/psa-systems/mokosh-server.git"
# MAPPS-396: track the server's `mokosh-client-login` branch while
# `tenant_slug` on LoginRequest waits to reach main. Drop `branch = ...`
# once the branch merges so the pin follows main again.
branch = "mokosh-client-login"

[dependencies.dioxus]
version = "0.7.7"
features = [
    "router",
    "web",
]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.uuid]
version = "1.11"
features = [
    "v4",
    "v7",
    "serde",
    "js",
]

[dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]

[dependencies.chrono]
version = "0.4"
features = [
    "serde",
    "wasmbind",
]

[dependencies.chrono-tz]
version = "0.10"

[dependencies.rust_decimal]
version = "1"
features = ["serde"]

[dependencies.validator]
version = "0.19"
features = ["derive"]

[dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "Storage",
    "Navigator",
    "Location",
    "UrlSearchParams",
    "MessageEvent",
    "EventTarget",
    "Event",
    "MediaQueryList",
    "Performance",
    # MAPPS-292: unsaved-changes guard listens on window's `beforeunload`.
    "BeforeUnloadEvent",
    # MAPPS-355: auth heartbeat skips its request when the tab is hidden.
    "VisibilityState",
    # MAPPS-364: client-side file download for the data export. A bearer-authed
    # GET returns bytes that are wrapped in a Blob and saved via a synthesized
    # anchor (Url::create_object_url_with_blob + HtmlAnchorElement::click).
    "Blob",
    "Url",
    "HtmlAnchorElement",
    # MAPPS-364: attach the download anchor to the DOM before clicking it
    # (append_child / remove_child) so the download fires reliably across
    # browsers, not only where a detached-anchor click is honored.
    "Node",
]

[dev-dependencies]
# MAPPS-388: render components to an HTML string in unit tests so layout
# regressions (e.g. an empty-state row losing its colspan / center) are caught
# on the host `cargo test`. Host-only: dev-deps are not built for the
# `wasm32-unknown-unknown` check.
dioxus-ssr = "0.7.7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
# MAPPS-396 dev-box unblock: rustc peak RSS on this crate's lib compile
# (huge Dioxus router + all pages) sits around 2.5 GB with debug=2 and
# still trips earlyoom at debug=1 (~1.5 GB free floor on this box). `debug = 0`
# drops the DWARF section entirely; panic messages in the browser lose
# source-line mapping but the app still boots. Bump back once the app is
# split into smaller crates or run on a box with more RAM headroom.
debug = 0

[profile.dev.package."*"]
opt-level = 3

# MAPPS-396: dx (`dx serve`) writes wasm builds under `target/wasm32-.../wasm-dev`,
# a custom cargo profile it derives from `dev`. Declaring it here lets us set
# per-profile knobs without touching host `dev`.
#
# Two memory-side knobs, together sized for a dev box where earlyoom's
# SIGTERM threshold is ~1.5 GB free:
#
#   `debug = 0` drops DWARF from every rustc invocation. Panic messages in
#   the browser lose source-line mapping (WASM debugging is limited anyway)
#   but the rustc peak drops ~500 MB.
#
#   `codegen-units = 1` forces rustc to serialize LLVM codegen into a single
#   instance instead of running one per CPU (dev default is 256, capped by
#   cpu count, so 8+ parallel LLVM instances on a modern box). Each LLVM
#   instance holds 200-400 MB of IR; with 8 running in parallel the peak
#   walked to ~3 GB. Serial codegen brings it under ~1.5 GB. The trade is
#   wall time: mokosh_apps compiles ~2-3x slower (~90s -> ~200s the first
#   time; incremental after that is fine). Worth it on this dev box; a
#   beefier build host can override in a local `.cargo/config.toml`.
[profile.wasm-dev]
inherits = "dev"
# Measured on a Dioxus 132-route crate + ~56k lines of pages, wasm target,
# stable rustc 1.94.1:
#
#   default dev profile (cgu default, debug=2, assertions on):   ~3000 MB peak, ~85s
#   + codegen-units = 1                                          :  ~2589 MB peak, ~510s
#   + codegen-units = 256, debug=0, assertions off, overflow off :  ~2146 MB peak, ~220s
#
# The last row is what this profile sets. It fits under the earlyoom
# SIGTERM floor (1.5 GB free on a 15 GB box) with headroom to spare
# and is 4x faster than cgu=1. The trick is that many small LLVM units
# stream in and out, freeing memory as each finishes; cgu=1 forced one
# huge unit that held every IR node at peak.
#
# Trade vs stock dev: no DWARF (browser panic messages lose source-line
# mapping; WASM debugging is source-map-only anyway), no debug-assert /
# overflow-check (same posture as release). None of that affects
# feature behaviour or block iteration.
debug = 0
codegen-units = 256
debug-assertions = false
overflow-checks = false
