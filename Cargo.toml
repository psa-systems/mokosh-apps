[workspace]

[package]
name = "mokosh-apps"
version = "0.4.0"
edition = "2021"
authors = ["Mokosh Platform Team"]
description = "Mokosh Platform - Cross-platform Dioxus client"
license = "Proprietary"
repository = "https://dev.a8n.run/psa-systems/mokosh-apps"

[[bin]]
name = "mokosh-apps"
path = "src/main.rs"

[features]
default = [
    "web",
    "multi-tenant",
]
web = []
multi-tenant = []
single-tenant = []
server = []
# MAPPS-338: opt-in dev shortcut that auto-signs the WASM in as Admin
# from `ADMIN_EMAIL` + `ADMIN_PASSWORD` compile-time env. Off by default
# even in debug builds so a debug WASM that ships to staging by accident
# does not auto-grant Admin. Flip on locally via
# `cargo run --features dev_admin_bypass` (and set the env vars).
dev_admin_bypass = []

[lib]
name = "mokosh_apps"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
gloo-net = "0.6"
futures-util = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
# MAPPS-299: forward Rust panics in the wasm runtime to console.error with
# a readable message + stack trace. Without this a panic surfaces as an
# opaque `RuntimeError: unreachable` at a hex offset (e.g. wasm:0x352c4f)
# the user has no way to act on. The hook is install-once at startup.
console_error_panic_hook = "0.1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
pulldown-cmark = "0.12"
ammonia = "4"

[dependencies.dioxus]
version = "0.7.7"
features = [
    "router",
    "web",
]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.uuid]
version = "1.11"
features = [
    "v4",
    "v7",
    "serde",
    "js",
]

[dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]

[dependencies.chrono]
version = "0.4"
features = [
    "serde",
    "wasmbind",
]

[dependencies.chrono-tz]
version = "0.10"

[dependencies.rust_decimal]
version = "1"
features = ["serde"]

[dependencies.validator]
version = "0.19"
features = ["derive"]

[dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "Storage",
    "Navigator",
    "Location",
    "UrlSearchParams",
    "MessageEvent",
    "EventTarget",
    "Event",
    "MediaQueryList",
    "Performance",
    # MAPPS-292: unsaved-changes guard listens on window's `beforeunload`.
    "BeforeUnloadEvent",
]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
