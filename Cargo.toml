[workspace]

[package]
name = "mokosh-apps"
version = "0.13.0"
edition = "2021"
authors = ["Mokosh Platform Team"]
description = "Mokosh Platform - Cross-platform Dioxus client"
license = "Proprietary"
repository = "https://dev.a8n.run/psa-systems/mokosh-apps"

[[bin]]
name = "mokosh-apps"
path = "src/main.rs"

[features]
default = [
    "web",
    "multi-tenant",
]
# MAPPS-507: `app` is the APP-RUNTIME gate, not a platform gate. It turns on
# the `api` module, the app-wide GlobalSignals, and page logic, none of which
# is browser-specific, and it is on for every build that produces the actual
# application. Browser-only code lives behind `src/platform/`, split on
# `target_arch`, not behind a feature.
app = []
# The two renderers. Each pulls in the runtime plus exactly one dioxus
# renderer, so no build enables a feature named for a platform it is not
# running on. Enabling both `dioxus/web` and `dioxus/desktop` does pick
# desktop (dioxus documents that priority), but it also links dioxus-web and
# its wasm-bindgen stubs into a native binary for nothing.
web = ["app", "dioxus/web"]
desktop = ["app", "dioxus/desktop"]
multi-tenant = []
single-tenant = []
server = []
# MAPPS-338: opt-in dev shortcut that auto-signs the WASM in as Admin
# from `ADMIN_EMAIL` + `ADMIN_PASSWORD` compile-time env. Off by default
# even in debug builds so a debug WASM that ships to staging by accident
# does not auto-grant Admin. Flip on locally via
# `cargo run --features dev_admin_bypass` (and set the env vars).
dev_admin_bypass = []

[lib]
name = "mokosh_apps"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
pulldown-cmark = "0.12"
ammonia = "4"
# MAPPS-383: shared wire-format DTOs, the single source of truth for types
# crossing the mokosh-server / mokosh-apps boundary. The URL is HTTPS, not
# ssh://, because the pre-commit container and the Forgejo check runner have
# no SSH credentials; anonymous HTTPS read needs none. There is deliberately
# no `rev`/`tag`/`branch`: MAPPS-525 keeps the resolved commit in Cargo.lock at
# the server's head instead, enforced by scripts/check-types-pin.sh, so a DTO
# change over there turns this build red rather than drifting unnoticed.
[dependencies.mokosh-types]
git = "https://dev.a8n.run/psa-systems/mokosh-server.git"

[dependencies.dioxus]
version = "0.7.7"
features = [
    "router",
]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.uuid]
version = "1.11"
features = [
    "v4",
    "v7",
    "serde",
    "js",
]

[dependencies.chrono]
version = "0.4"
features = [
    "serde",
    "wasmbind",
]

[dependencies.chrono-tz]
version = "0.10"

[dependencies.rust_decimal]
version = "1"
features = ["serde"]

[dependencies.validator]
version = "0.19"
features = ["derive"]

# MAPPS-504: the browser bindings. Reachable ONLY from the wasm half of
# `src/platform/`; a `web_sys` / `js_sys` / `gloo_*` path anywhere else now
# fails to resolve on the native build instead of compiling to a binding that
# panics at run time.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
# MAPPS-299: forward Rust panics in the wasm runtime to console.error with
# a readable message + stack trace. Without this a panic surfaces as an
# opaque `RuntimeError: unreachable` at a hex offset (e.g. wasm:0x352c4f)
# the user has no way to act on. The hook is install-once at startup. The
# desktop build has no console to forward to and keeps the default Rust
# panic handler, which already writes a backtrace to stderr.
console_error_panic_hook = "0.1"
# MAPPS-588: awaiting a JS promise from the platform layer. A pasted image
# arrives as a `File`, and turning one into bytes is `Blob::array_buffer()`,
# which returns a promise. The alternative is `FileReader` plus a second
# forgotten `Closure` for its `load` event, and forgotten closures around
# dioxus state are what MAPPS-586 was.
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]

[target.'cfg(target_arch = "wasm32")'.dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "Storage",
    "Navigator",
    "Location",
    "UrlSearchParams",
    "MessageEvent",
    "EventTarget",
    "Event",
    "MediaQueryList",
    "Performance",
    # MAPPS-292: unsaved-changes guard listens on window's `beforeunload`.
    "BeforeUnloadEvent",
    # MAPPS-355: auth heartbeat skips its request when the tab is hidden.
    "VisibilityState",
    # MAPPS-364: client-side file download for the data export. A bearer-authed
    # GET returns bytes that are wrapped in a Blob and saved via a synthesized
    # anchor (Url::create_object_url_with_blob + HtmlAnchorElement::click).
    "Blob",
    "Url",
    "HtmlAnchorElement",
    # MAPPS-364: attach the download anchor to the DOM before clicking it
    # (append_child / remove_child) so the download fires reliably across
    # browsers, not only where a detached-anchor click is honored.
    "Node",
    # MAPPS-429: the tenant logo is PUT as multipart/form-data, which the
    # browser assembles (and boundary-delimits) from a FormData carrying a Blob.
    # Building that body by hand would mean generating a boundary and hoping it
    # never appears in the image bytes.
    "BlobPropertyBag",
    "FormData",
    # MAPPS-432: /auth/callback logs one console.error line before it silently
    # restarts the login flow, so the suppressed error leaves a record.
    "console",
    # MAPPS-588: paste an image into the KB body. dioxus-html 0.7's
    # `ClipboardData` carries no files, only the event, so the paste is read
    # from a real listener over `clipboardData.items`.
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "File",
]

# MAPPS-504: the native half of `src/platform/`. `reqwest` replaces browser
# `fetch`, `tokio` replaces `gloo_timers`, `iana-time-zone` replaces
# `Intl.DateTimeFormat().resolvedOptions().timeZone`, and `dirs` locates the
# per-user config and download directories.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
iana-time-zone = "0.1"
# Hands a URL to the OS default browser. The desktop window is the app,
# not a document to navigate away from, so the destinations that were
# `location.replace` on the web (the OP logout endpoint, the Bunyip hub)
# belong in the user's real browser.
open = "5"

# rustls, not the platform TLS stack: one behaviour on every desktop OS, and
# no OpenSSL headers needed to build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "json",
    "rustls-tls",
    "multipart",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1"
features = ["time"]

[dev-dependencies]
# MAPPS-388: render components to an HTML string in unit tests so layout
# regressions (e.g. an empty-state row losing its colspan / center) are caught
# on the host `cargo test`. Host-only: dev-deps are not built for the
# `wasm32-unknown-unknown` check.
dioxus-ssr = "0.7.7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
