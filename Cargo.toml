[workspace]

[package]
name = "mokosh-apps"
version = "0.13.0"
edition = "2021"
authors = ["Mokosh Platform Team"]
description = "Mokosh Platform - Cross-platform Dioxus client"
license = "Proprietary"
repository = "https://dev.a8n.run/psa-systems/mokosh-apps"

[[bin]]
name = "mokosh-apps"
path = "src/main.rs"

[features]
default = [
    "web",
    "multi-tenant",
]
# MAPPS-507: `app` is the APP-RUNTIME gate, not a platform gate. It turns on
# the `api` module, the app-wide GlobalSignals, and page logic, none of which
# is browser-specific, and it is on for every build that produces the actual
# application. Browser-only code lives behind `src/platform/`, split on
# `target_arch`, not behind a feature.
app = []
# The two renderers. Each pulls in the runtime plus exactly one dioxus
# renderer, so no build enables a feature named for a platform it is not
# running on. Enabling both `dioxus/web` and `dioxus/desktop` does pick
# desktop (dioxus documents that priority), but it also links dioxus-web and
# its wasm-bindgen stubs into a native binary for nothing.
web = ["app", "dioxus/web"]
desktop = ["app", "dioxus/desktop"]
multi-tenant = []
single-tenant = []
server = []
# MAPPS-338: opt-in dev shortcut that auto-signs the WASM in as Admin
# from `ADMIN_EMAIL` + `ADMIN_PASSWORD` compile-time env. Off by default
# even in debug builds so a debug WASM that ships to staging by accident
# does not auto-grant Admin. Flip on locally via
# `cargo run --features dev_admin_bypass` (and set the env vars).
dev_admin_bypass = []

[lib]
name = "mokosh_apps"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
pulldown-cmark = "0.12"
ammonia = "4"
# MAPPS-383: shared wire-format DTOs, the single source of truth for types
# crossing the mokosh-server / mokosh-apps boundary. The URL is HTTPS, not
# ssh://, because the pre-commit container and the Forgejo check runner have
# no SSH credentials; anonymous HTTPS read needs none. There is deliberately
# no `rev`/`tag`/`branch`: MAPPS-525 keeps the resolved commit in Cargo.lock at
# the server's head instead, enforced by scripts/check-types-pin.sh, so a DTO
# change over there turns this build red rather than drifting unnoticed.
[dependencies.mokosh-types]
git = "https://dev.a8n.run/psa-systems/mokosh-server.git"
# MAPPS-617: follow `mokosh-contact-login` (the long-lived contact-
# portal + branding integration branch on the server), a superset of
# the retired `mokosh-client-login` pin. Once this whole track merges
# to main, drop `branch = ...` and let the pin follow main again.
#
# Bumping the pin requires the server branch to actually contain the
# branding types (`CompanyBranding`, `EffectiveBranding`, and the
# `background_*` / `display_name` fields on `TenantBranding`). Until
# MAPPS-617 lands on this branch, the client uses local shadow types
# in `hooks/branding.rs` that mirror the wire shape byte-for-byte via
# `serde(default)`; runtime interop works regardless of which commit
# `Cargo.lock` resolves to. After the server merge + a
# `cargo update -p mokosh-types` here, the shadow types can be
# deleted in favour of `pub use mokosh_types::...`.
# Pinned to the server's chore/merge-main-into-contact-login scratch
# branch head so client + server merges land in lockstep. Replace with
# `branch = "mokosh-contact-login"` when both scratch branches merge
# to their respective mokosh-contact-login refs.
rev = "f97e387854404331fcf498269572ac797bf24f3b"

[dependencies.dioxus]
version = "0.7.7"
features = [
    "router",
]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.uuid]
version = "1.11"
features = [
    "v4",
    "v7",
    "serde",
    "js",
]

[dependencies.chrono]
version = "0.4"
features = [
    "serde",
    "wasmbind",
]

[dependencies.chrono-tz]
version = "0.10"

[dependencies.rust_decimal]
version = "1"
features = ["serde"]

[dependencies.validator]
version = "0.19"
features = ["derive"]

# MAPPS-504: the browser bindings. Reachable ONLY from the wasm half of
# `src/platform/`; a `web_sys` / `js_sys` / `gloo_*` path anywhere else now
# fails to resolve on the native build instead of compiling to a binding that
# panics at run time.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
# MAPPS-299: forward Rust panics in the wasm runtime to console.error with
# a readable message + stack trace. Without this a panic surfaces as an
# opaque `RuntimeError: unreachable` at a hex offset (e.g. wasm:0x352c4f)
# the user has no way to act on. The hook is install-once at startup. The
# desktop build has no console to forward to and keeps the default Rust
# panic handler, which already writes a backtrace to stderr.
console_error_panic_hook = "0.1"
# MAPPS-588: awaiting a JS promise from the platform layer. A pasted image
# arrives as a `File`, and turning one into bytes is `Blob::array_buffer()`,
# which returns a promise. The alternative is `FileReader` plus a second
# forgotten `Closure` for its `load` event, and forgotten closures around
# dioxus state are what MAPPS-586 was.
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]

[target.'cfg(target_arch = "wasm32")'.dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DomTokenList",
    "Storage",
    "Navigator",
    # MAPPS-635 B: navigator.clipboard for the Portal Access "Copy
    # link" button on the Company detail page.
    "Clipboard",
    "Location",
    "UrlSearchParams",
    "MessageEvent",
    "EventTarget",
    "Event",
    "MediaQueryList",
    "Performance",
    # MAPPS-292: unsaved-changes guard listens on window's `beforeunload`.
    "BeforeUnloadEvent",
    # MAPPS-355: auth heartbeat skips its request when the tab is hidden.
    "VisibilityState",
    # MAPPS-364: client-side file download for the data export. A bearer-authed
    # GET returns bytes that are wrapped in a Blob and saved via a synthesized
    # anchor (Url::create_object_url_with_blob + HtmlAnchorElement::click).
    "Blob",
    "Url",
    "HtmlAnchorElement",
    # MAPPS-364: attach the download anchor to the DOM before clicking it
    # (append_child / remove_child) so the download fires reliably across
    # browsers, not only where a detached-anchor click is honored.
    "Node",
    # MAPPS-429: the tenant logo is PUT as multipart/form-data, which the
    # browser assembles (and boundary-delimits) from a FormData carrying a Blob.
    # Building that body by hand would mean generating a boundary and hoping it
    # never appears in the image bytes.
    "BlobPropertyBag",
    "FormData",
    # MAPPS-432: /auth/callback logs one console.error line before it silently
    # restarts the login flow, so the suppressed error leaves a record.
    "console",
    # MAPPS-588: paste an image into the KB body. dioxus-html 0.7's
    # `ClipboardData` carries no files, only the event, so the paste is read
    # from a real listener over `clipboardData.items`.
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "File",
]

# MAPPS-504: the native half of `src/platform/`. `reqwest` replaces browser
# `fetch`, `tokio` replaces `gloo_timers`, `iana-time-zone` replaces
# `Intl.DateTimeFormat().resolvedOptions().timeZone`, and `dirs` locates the
# per-user config and download directories.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
iana-time-zone = "0.1"
# Hands a URL to the OS default browser. The desktop window is the app,
# not a document to navigate away from, so the destinations that were
# `location.replace` on the web (the OP logout endpoint, the Bunyip hub)
# belong in the user's real browser.
open = "5"

# rustls, not the platform TLS stack: one behaviour on every desktop OS, and
# no OpenSSL headers needed to build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "json",
    "rustls-tls",
    "multipart",
]

# MAPPS-505 adds `net` + `io-util` on top of `time`: the RFC 8252 loopback
# redirect listener accepts one connection on 127.0.0.1 and reads the
# request line off it. The runtime itself comes from dioxus-desktop, which
# builds a multi-threaded one with every driver enabled.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1"
features = [
    "time",
    "net",
    "io-util",
]

[dev-dependencies]
# MAPPS-388: render components to an HTML string in unit tests so layout
# regressions (e.g. an empty-state row losing its colspan / center) are caught
# on the host `cargo test`. Host-only: dev-deps are not built for the
# `wasm32-unknown-unknown` check.
dioxus-ssr = "0.7.7"

# MAPPS-505: the loopback listener tests drive `serve_one` to completion, so
# they need a runtime to drive it ON. The app never builds one - dioxus-desktop
# owns that - which is why this is a dev-dependency and not a feature of the
# runtime dependency above.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tokio]
version = "1"
features = ["rt-multi-thread"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# dx serve --release / `just dev-release` writes wasm builds under
# target/wasm32-unknown-unknown/wasm-release/, a custom profile that
# inherits from release. On a memory-constrained dev box the stock
# [profile.release] settings (`lto = true` + `codegen-units = 1`) peak
# rustc RSS around 4-5 GB during LTO codegen and OOM. Thin LTO with
# codegen-units = 16 gives ~90% of the size reduction (small wasm keeps
# wasm-bindgen happy) at roughly a third of the peak memory. Trade for
# production: none - the [profile.release] block above is untouched, so
# CI + deployed builds still use fat LTO. This profile is dev-only.
[profile.wasm-release]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 0
# MAPPS-396 dev-box unblock: rustc peak RSS on this crate's lib compile
# (huge Dioxus router + all pages) sits around 2.5 GB with debug=2 and
# still trips earlyoom at debug=1 (~1.5 GB free floor on this box). `debug = 0`
# drops the DWARF section entirely; panic messages in the browser lose
# source-line mapping but the app still boots. Bump back once the app is
# split into smaller crates or run on a box with more RAM headroom.
debug = 0

[profile.dev.package."*"]
opt-level = 3

# MAPPS-396: dx (`dx serve`) writes wasm builds under `target/wasm32-.../wasm-dev`,
# a custom cargo profile it derives from `dev`. Declaring it here lets us set
# per-profile knobs without touching host `dev`.
#
# Two memory-side knobs, together sized for a dev box where earlyoom's
# SIGTERM threshold is ~1.5 GB free:
#
#   `debug = 0` drops DWARF from every rustc invocation. Panic messages in
#   the browser lose source-line mapping (WASM debugging is limited anyway)
#   but the rustc peak drops ~500 MB.
#
#   `codegen-units = 1` forces rustc to serialize LLVM codegen into a single
#   instance instead of running one per CPU (dev default is 256, capped by
#   cpu count, so 8+ parallel LLVM instances on a modern box). Each LLVM
#   instance holds 200-400 MB of IR; with 8 running in parallel the peak
#   walked to ~3 GB. Serial codegen brings it under ~1.5 GB. The trade is
#   wall time: mokosh_apps compiles ~2-3x slower (~90s -> ~200s the first
#   time; incremental after that is fine). Worth it on this dev box; a
#   beefier build host can override in a local `.cargo/config.toml`.
[profile.wasm-dev]
inherits = "dev"
# Two problems this profile solves for a memory-constrained dev box:
#
# 1. rustc peak RSS on the mokosh_apps lib compile
#    Measured on a Dioxus 132-route crate + ~56k lines of pages, stable rustc
#    1.94.1, wasm target:
#      stock dev  (cgu default, debug=2, assertions on) : ~3000 MB, ~85s
#      + codegen-units = 1                              : ~2589 MB, ~510s
#      + cgu = 256, debug = 0, assertions off, ovf off  : ~2146 MB, ~220s
#    codegen-units = 256 lets LLVM stream small units in and out; cgu = 1
#    (the first instinct) forced one huge unit that held every IR node at peak.
#
# 2. wasm-bindgen post-process OOM after cargo finished
#    A 44 MB unstripped dev WASM expands ~30x during wasm-bindgen's parse:
#    ~1.5 GB in wasm-bindgen + another ~1.5 GB dx holds simultaneously = OOM
#    even after cargo succeeded. `opt-level = "s"` (dead-code + basic inlining
#    tuned for size) drops the WASM to ~15-20 MB, so wasm-bindgen fits in
#    ~500 MB. Trade: mokosh_apps compile is slower (opt-level ~1 for the
#    app code) but the whole pipeline actually completes.
#
# Trade vs stock dev: no DWARF (browser panic messages lose source-line
# mapping; WASM debugging is source-map-only anyway), no debug-assert /
# overflow-check (same posture as release). None of that affects feature
# behaviour. The opt-level = "s" DOES slow down hot-reload iteration; the
# alternative is `just dev-release` (thin-LTO, no hot reload at all).
opt-level = "s"
debug = 0
codegen-units = 256
debug-assertions = false
overflow-checks = false
# `panic = "abort"` drops the unwind tables rustc otherwise generates
# for every monomorphized function in the crate + its deps. On a
# Dioxus 132-route crate the unwind IR is the last chunk holding
# rustc's peak RSS over the earlyoom ceiling; abort saves ~200-400 MB
# on the final lib link phase. Trade: a Rust panic in wasm calls
# `wasm-unreachable` instead of unwinding through the stack, so a
# `catch_unwind` in dev is inert. The SPA has no `catch_unwind`
# callers, and browser panic-hook reporting (console_error_panic_hook)
# still fires because it hooks the panic handler before abort runs.
panic = "abort"
