<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mokosh Platform - Professional Services Automation for MSPs">
    <meta name="theme-color" content="#2563eb">

    <title>Mokosh Platform</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- PWA manifest (declares icon-192/512 + maskable) -->
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Fonts: Inter + JetBrains Mono stay first in --font-sans / --font-mono
         (see assets/styles.css), with a system-ui fallback chain that every OS
         provides out of the box. Google Fonts is intentionally NOT loaded: the
         SPA's CSP `style-src 'self' 'unsafe-inline'` refuses external
         stylesheets, so the previous <link rel="stylesheet" href="fonts.googleapis.com/...">
         was blocked at runtime anyway. If we later want Inter shipped for real,
         self-host it under assets/fonts/ (MAPPS-356). -->

    <!-- MAPPS-356: FOUC-prevention theme applier. External same-origin file
         because the CSP `script-src 'self' 'wasm-unsafe-eval'` refuses inline
         script execution. The WASM app takes over the theme once it boots. -->
    <script src="/assets/theme-init.js"></script>
</head>
<body>
    <!-- App root -->
    <div id="main"></div>

    <!-- Dioxus will inject scripts here -->
</body>
</html>
