# Publishes mokosh-apps' own docs to the Storefront docs site under /docs/mokosh-apps.
source = "mokosh-apps"
base_path = "/docs/mokosh-apps"
include = ["README.md", "src/**/*.rs"]
exclude = ["CLAUDE.md", "docs/**", "common/**", "tests/**", "target/**"]

[storefront]
url = "https://docs.a8n.systems"
site = "docs"

[titles]
"src" = "Module reference"
