services:
  client:
    container_name: dev-mokosh-client-${USER:?USER missing - run via just dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - .:/app
      - client-target:/app/target
      - client-node-modules:/app/node_modules
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_IP}:4301:4301"
    networks:
      - private

volumes:
  client-target:
    name: dev-mokosh-client-target-${USER:?USER missing - run via just dev}
  client-node-modules:
    name: dev-mokosh-client-node-modules-${USER:?USER missing - run via just dev}

networks:
  private:
    name: dev-mokosh-private-${USER:?USER missing - run via just dev}
    external: true
