services:
  client:
    container_name: dev-mokosh-apps-${USER:?USER missing - run via just dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - .:/app
      - client-target:/app/target
      - client-node-modules:/app/node_modules
    env_file:
      - path: .env
        required: false
    ports:
      # Two publishes, because two different callers reach dx serve.
      # `${HOST_IP}` is the private LAN address `just dev` picks: that is
      # the one sibling Docker stacks and other hosts on the LAN use. The
      # loopback publish is the one a browser on the dev host itself opens
      # at http://localhost:4301.
      #
      # Keeping both costs nothing when they coincide: `just dev` falls back
      # to HOST_IP=127.0.0.1 when it finds no private LAN IPv4, and compose
      # collapses the two identical entries into a single binding rather
      # than failing on the port, so the loopback route survives that
      # fallback instead of racing the LAN one for the port.
      - "${HOST_IP}:4301:4301"
      - "127.0.0.1:4301:4301"
    networks:
      - private

volumes:
  client-target:
    name: dev-mokosh-apps-target-${USER:?USER missing - run via just dev}
  client-node-modules:
    name: dev-mokosh-apps-node-modules-${USER:?USER missing - run via just dev}

networks:
  private:
    name: dev-mokosh-private-${USER:?USER missing - run via just dev}
    external: true
