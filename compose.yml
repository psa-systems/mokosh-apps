services:
  client:
    container_name: dev-mokosh-apps-${USER:?USER missing - run via just dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    user: ${HOST_UID}:${HOST_GID}
    volumes:
      - .:/app
      - client-target:/app/target
      - client-node-modules:/app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      # `just dev` leaves this empty (dx serve in default debug mode).
      # `just dev-release` sets it to `--release` so the container's CMD
      # runs `dx serve --release --port 4301 --addr 0.0.0.0`. Needed on
      # hosts where dx's debug-mode post-processing chokes on the giant
      # unstripped WASM (`Failed to write executable`).
      DX_SERVE_ARGS: ${DX_SERVE_ARGS:-}
      # PMS-729 / MAPPS-396: cap cargo package parallelism to a single
      # rustc process. Combined with the wasm-dev profile's
      # `codegen-units = 256` streaming (in Cargo.toml), this keeps rustc
      # peak RSS around ~2.1 GB - fits under the ~1.5 GB earlyoom SIGTERM
      # floor on a 15 GB dev box with headroom.
      #
      # Without this the container defaults to `nproc` parallel rustc
      # processes on a full dep recompile (e.g. after a profile flag
      # change invalidates fingerprints), and each holds 200-400 MB - 8
      # concurrent = 2-3 GB spike that trips OOM protection before the
      # mokosh_apps crate even starts.
      #
      # Container-scoped so host `cargo` outside the container keeps its
      # nproc parallelism. Wall-time cost: ~2x slower on a cold cache;
      # incremental rebuilds are unchanged.
      CARGO_BUILD_JOBS: "1"
    ports:
      # LAN-IP bind so other Docker containers on the host can reach the
      # dev server, plus a localhost bind so the browser can hit
      # http://localhost:4301 (required for Google OAuth - the redirect
      # URI rejects plain HTTP on non-loopback hosts).
      - "${HOST_IP}:4301:4301"
      - "127.0.0.1:4301:4301"
    networks:
      - private

volumes:
  client-target:
    name: dev-mokosh-apps-target-${USER:?USER missing - run via just dev}
  client-node-modules:
    name: dev-mokosh-apps-node-modules-${USER:?USER missing - run via just dev}

networks:
  private:
    name: dev-mokosh-private-${USER:?USER missing - run via just dev}
    external: true
