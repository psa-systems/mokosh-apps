# Configure Dioxus
# https://dioxuslabs.com/learn/0.7/guides/tools/configure

[application]
# App name
name = "mokosh-client"

# Dioxus App Default Platform
default_platform = "web"

# resource (assets) file folder
asset_dir = "assets"

# Asset configuration
[web.app]
# HTML title is set in index.html (<title>Mokosh Platform</title>);
# specifying it here too caused the doubled "Mokosh PlatformMokosh
# Platform" tab title flagged by the audit (P1-09).

# CSS is included via asset!() macro in Rust code
[web.resource]

[web.resource.dev]

[server]
# Server configuration
port = 4300
ip = "0.0.0.0"

[server.middleware]
# Middleware configuration (compression, cors handled in code)

# Reverse-proxy /api/* to the mokosh-server container so the SPA and the
# API share a single browser-visible origin in dev. Required for the
# Google OAuth popup + postMessage flow to satisfy same-origin checks.
# `server` is the in-network DNS name of the mokosh-server compose
# service (the dev-mokosh-private-${USER} network is shared with the
# server stack).
[[web.proxy]]
backend = "http://server:4301/api/"

[build]
# Build configuration
target_dir = "target"

[bundle]
# Desktop bundle configuration (if building native apps)
identifier = "com.mokosh.platform"
publisher = "Mokosh Platform"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
