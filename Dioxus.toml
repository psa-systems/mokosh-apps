# Configure Dioxus
# https://dioxuslabs.com/learn/0.7/guides/tools/configure

[application]
# App name
name = "mokosh-apps"

# Dioxus App Default Platform
default_platform = "web"

# resource (assets) file folder
asset_dir = "assets"

# Asset configuration
[web.app]
# dx 0.7.7 APPENDS this string to whatever already lives inside the
# `<title>` element in index.html. When the field is unset, dx
# defaults to "dioxus | ⛺", producing tab titles like
# "Mokosh Platformdioxus | ⛺". Setting it to an empty string makes
# the append a no-op so index.html's literal <title>Mokosh Platform</title>
# is the entire tab title.
title = ""

# CSS is included via asset!() macro in Rust code
[web.resource]

[web.resource.dev]

[server]
# Server configuration
port = 4300
ip = "0.0.0.0"

[server.middleware]
# Middleware configuration (compression, cors handled in code)

# Reverse-proxy /api/* to the mokosh-server container so the SPA and the
# API share a single browser-visible origin in dev. Required for the
# Google OAuth popup + postMessage flow to satisfy same-origin checks.
# `server` is the in-network DNS name of the mokosh-server compose
# service (the dev-mokosh-private-${USER} network is shared with the
# server stack). The server listens on its $MOKOSH_PORT (8080); 4301 is
# the SPA dev-server port, not the API port.
[[web.proxy]]
backend = "http://server:8080/api/"

[build]
# Build configuration
target_dir = "target"

# MAPPS-504: consumed by `just desktop-bundle` (`dx bundle --platform desktop`).
# The paths are repo-relative and the files are the ones that exist; before
# MAPPS-504 they pointed at an `icons/` directory at the repo root, which has
# never been where the icons live.
[bundle]
identifier = "com.mokosh.platform"
publisher = "Mokosh Platform"
icon = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/128x128@2x.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]
