# Publishes this repo's user-facing docs to docs.a8n.systems under /docs/mokosh-apps.
# This file sits at docs/public/ so the publish-docs workflow runs sarracenia
# from here as the walk root; sidebar content mounts directly under the
# "Mokosh apps" top-level entry with no intermediate layers. Everything under
# docs/public/ is published; nothing outside it is.
source = "mokosh-apps"
base_path = "/docs/mokosh-apps"
title = "Mokosh apps"
include = ["**/*.md"]
exclude = []

[storefront]
url = "https://docs.a8n.systems"
site = "docs"
