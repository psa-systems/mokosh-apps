---

# Validate code on every push and pull request: clippy, fmt, build, tests.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: clippy + fmt + tests
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `assets/styles.css` is a gitignored Tailwind build artifact, so it is
      # absent on a clean checkout. This workflow only compile-validates and
      # never renders CSS, so an empty file is enough to satisfy the
      # `asset!("/assets/styles.css")` macro in src/main.rs. The real CSS is
      # built by oci-build/Dockerfile for deployment.
      - name: Stub generated CSS asset
        run: mkdir -p assets && touch assets/styles.css

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check web/WASM build
        run: cargo check --target wasm32-unknown-unknown

      - name: Unit tests
        run: cargo test --lib
