---

# Validate code on every push and pull request by running 'just check'
# Mirrors the local `just check` + `just test` recipes (which use ./dev/cargo).
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: fmt + clippy + tests
    # Dev label: this job compiles Rust on the runner, and only the dev image
    # ships the C toolchain (cc/gcc/ld) that rustc drives linking through.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `assets/styles.css` is a gitignored Tailwind build artifact, so it is
      # absent on a clean checkout. This workflow only compile-validates and
      # never renders CSS, so an empty file is enough to satisfy the
      # `asset!("/assets/styles.css")` macro in src/main.rs. The real CSS is
      # built by oci-build/Dockerfile for deployment.
      - name: Stub generated CSS asset
        run: mkdir -p assets && touch assets/styles.css

      - name: Runner-label guard
        run: bash scripts/check-runner-labels.sh

      # MAPPS-401: enforce the MAPPS-259 semantic tokens in CI. Without this
      # step the guard only ran locally, and hardcoded grays drifted back in.
      - name: Theme-token guard
        run: bash scripts/check-theme-tokens.sh

      # MAPPS-433: a colour name input.css never defined emits no CSS at all,
      # so the mistake is invisible in the browser and passes the theme-token
      # guard, which hunts the opposite mistake.
      # MAPPS-437: --self-test proves the guard still rejects an undefined name.
      # A guard that silently stopped guarding reports "clean" forever.
      - name: Defined-colour guard
        run: |
          bash scripts/check-defined-colors.sh --self-test
          bash scripts/check-defined-colors.sh

      # MAPPS-423: pin Cancel destinations for shared create/edit forms and
      # keep the base-layer pointer-cursor rule that compensates for Tailwind
      # v4's `button { cursor: default }` preflight.
      - name: Cancel-route and cursor guard
        run: bash scripts/check-cancel-routes.sh

      # MAPPS-432: /auth/callback classifies a failed exchange on the FlowError
      # variant; a string match on the error message must not come back.
      - name: Auth-error-prose guard
        run: bash scripts/check-auth-error-prose.sh

      # MAPPS-436: a Delete/Remove button only opens ConfirmDialog. MAPPS-189
      # wired the dialog app-wide; row Deletes added later shipped with no
      # confirmation at all, so the rule is enforced rather than documented.
      - name: Destructive-confirm guard
        run: bash scripts/check-confirm-destructive.sh

      # MAPPS-446: three class omissions with no effect in the default theme
      # (a heading with no weight, a form grid gated at md:, a name cell with
      # no colour token), so review does not catch them coming back.
      - name: Class-omission guard
        run: bash scripts/check-class-omissions.sh

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check web/WASM build
        run: cargo check --target wasm32-unknown-unknown

      - name: Unit tests
        run: cargo test --lib
