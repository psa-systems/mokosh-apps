---

# Validate code on every push and pull request. Historically one serial
# job; now split so the ~35 bash guards and the cargo compile matrix
# ride different runners in parallel.
#
# MAPPS-452: this stays a private workflow rather than calling
# psa-systems/common's reusable check.yml, because the reusable one runs a
# single host-target compile and cannot express this repo's target matrix (the
# wasm32 SPA build plus the no-default-features desktop feature set) or the
# guard scripts the CI-parity guard pins to it. The two justfile guards the
# reusable workflow would have contributed run below instead.
#
# The split: `cargo` on BASE_HEAVY compiles fmt / clippy / wasm / desktop
# / unit tests / cargo-audit (the dev image's C toolchain is the only
# reason this needs HEAVY). `guards` on BASE_MEDIUM runs every bash /
# nu / just guard plus the doc-link + config-docs + CI-parity checks
# (no compiler involved, no reason to hold a scarce HEAVY slot).
# `secrets` keeps its own base-medium job unchanged.
#
# check-ci-parity.sh compares `just check` command lines against
# `run:` blocks in THIS file (not per-job), so splitting is safe for
# that guard: every command still appears in some job's run block.
# check-runner-labels.sh requires the `cargo` job itself to run on
# BASE_HEAVY, so renaming that job, or moving the compile to another job,
# means updating the guard too.
name: Check

# SPEC-1.10.1: trigger set and the paths-ignore list below.
on:
  # paths-ignore: these files cannot affect what any guard, compile, or
  # audit step here proves. docs-touching files (docs/**, **.md) are NOT
  # listed because this repo runs doc-link, config-docs and CLAUDE.md
  # guards on them; pure-doc PRs still trigger. paths-ignore skips a
  # run only when EVERY changed path matches, so one non-ignored edit
  # triggers the full suite.
  push:
    branches:
      - main
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - "renovate.json"
      - "CHANGELOG.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - "renovate.json"
      - "CHANGELOG.md"

# Supersede obsolete runs. `github.ref` differs between the pull_request
# ref (refs/pull/<N>/merge) and the main push (refs/heads/main), so PRs
# never share a group with each other or with the main push that primes
# the cache for them. A back-to-back main push does share the group, and
# that is the one case where cancel-in-progress matters here: two
# concurrent runs on the same main commit are a wasted compile.
# SPEC-1.10.2: a newer run for the same ref cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SPEC-1.10.3: classify, cargo, guards and secrets are the four jobs.
jobs:
  # MAPPS-1221/PC-134/STD-3.1: classify the PR diff with the shared `common`
  # action instead of a repo-local classifier, so the skip rule stays in one
  # place across the fleet. `result` is one of `code`, `comments-only` or
  # `non-code` (always `code` outside a pull_request event); the `cargo` job
  # below gates its compile-dependent steps on `result == 'code'` and
  # `cargo fmt` on `result != 'non-code'`. The guards and secrets jobs stay
  # unconditional: guards check source-file shape and secrets scans every
  # commit.
  classify:
    name: classify changed files
    # Only diffs file paths and greps `+`/`-` lines, compiles nothing.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    outputs:
      result: ${{ steps.classify-diff.outputs.result }}
    steps:
      - name: Clone the repository
        # Shallow is fine: classify-diff deepens the clone itself when it
        # needs HEAD^1.
        uses: https://code.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Classify diff
        id: classify-diff
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/classify-diff@74a301aac0f88bd4d9ade20787da56493f254db3 # main

  cargo:
    name: fmt + clippy + wasm + desktop + tests + audit
    # MAPPS-1221: the compile-dependent steps below are individually gated on
    # `classify`'s result (fmt on `result != 'non-code'`, the rest on
    # `result == 'code'`), so the job itself stays unconditional. The guards
    # and secrets jobs still run and cover docs-only / comment-only PRs on
    # their own.
    needs: classify
    # Heavy label: compiles and links Rust (clippy, wasm, desktop, tests) on the
    # runner, which needs the dev image's C toolchain.
    # SPEC-1.10.8: heavy label for the compile job, medium for the rest.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_HEAVY }}

    steps:
      - name: Clone the repository
        # No submodules here: nothing in this job calls `just`. Shallow by
        # default, which is fine because no step walks git log.
        uses: https://code.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@e728773130496a6e84e0d87de9390f3d98939019 # main

      - name: Build parallelism
        # The runner owns CARGO_BUILD_JOBS; this warns and falls back when unset.
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/build-parallelism@e728773130496a6e84e0d87de9390f3d98939019 # main

      - name: Cache Rust build
        # `shared-key: check` is the cross-ref cache contract. On forgejo-
        # runner a `pull_request` event writes under the per-PR isolation
        # key (`refs/pull/<N>/...`) only that PR can read, but a `push`
        # event writes under the empty key every later run in the repo can
        # read. check.yml fires on both triggers, so the push-to-main run
        # here doubles as the cache prime for subsequent PR runs; without
        # `shared-key`, rust-cache falls back to per-ref keys and no PR
        # benefits from the main push's compile. Match the key name in
        # any future mokosh-apps cache-warm workflow.
        uses: https://github.com/Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # SPEC-1.10.6: the cross-ref cache key.
          shared-key: check
          cache-on-failure: true

      # `assets/styles.css` is a gitignored Tailwind build artifact, so it is
      # absent on a clean checkout. This workflow only compile-validates and
      # never renders CSS, so an empty file is enough to satisfy the
      # `asset!("/assets/styles.css")` macro in src/main.rs. The real CSS is
      # built by oci-build/Dockerfile for deployment.
      # SPEC-1.8.8: a placeholder is enough to satisfy the asset!() macro for compile-only validation.
      - name: Stub generated CSS asset
        run: mkdir -p assets && touch assets/styles.css

      # SPEC-1.8.7: formatting, lint, and the wasm/desktop build/test matrix, all in this one job.
      # MAPPS-1221/STD-3.1: fmt still runs on a comments-only diff; only a
      # non-code (docs-only) diff skips it too.
      - name: Check formatting
        # SPEC-1.10.4: fmt skips only a non-code diff.
        if: needs.classify.outputs.result != 'non-code'
        run: cargo fmt --all --check

      # MAPPS-1221/STD-3.1: skipped on a comments-only or non-code diff.
      - name: Clippy
        if: needs.classify.outputs.result == 'code'
        run: cargo clippy --locked --all-targets -- -D warnings

      # MAPPS-1221/STD-3.1: skipped on a comments-only or non-code diff.
      - name: Check web/WASM build
        if: needs.classify.outputs.result == 'code'
        run: cargo clippy --locked --all-targets --target wasm32-unknown-unknown -- -D warnings

      # MAPPS-534: CI had never compiled this feature combination. The steps
      # above cover wasm and the host default, so a desktop-only break - a
      # `#[cfg(feature = "desktop")]` arm, or a web-only import the desktop
      # feature set does not satisfy - merged green and surfaced to whoever
      # next built the desktop app.
      # MAPPS-1221/STD-3.1: skipped on a comments-only or non-code diff.
      - name: Check desktop build
        if: needs.classify.outputs.result == 'code'
        run: cargo check --locked --no-default-features --features desktop,multi-tenant

      # MAPPS-1221/STD-3.1: skipped on a comments-only or non-code diff.
      - name: Unit tests
        if: needs.classify.outputs.result == 'code'
        run: cargo test --locked --lib

      # MAPPS-975: the CI image ships no cargo-audit, so the audit below was a
      # silent no-op. crates.io has no digest, so the crate version is the pin.
      # SPEC-1.4.11: a dependency vulnerability check on every CI run.
      #
      # A pinned release archive replaces `cargo install --locked cargo-audit`,
      # which compiled cargo-audit and its dependency tree from source on every
      # run (60-120s cold). cargo-audit publishes a prebuilt
      # linux-musl archive on GitHub releases (statically linked, runs on
      # the glibc builder image too); get the sha256 by downloading once and
      # pinning the hash the same way nextest/machete are pinned in
      # mokosh-server.
      #
      # `ghcr.io/niceguyit/rust-builder-glibc` sets CARGO_HOME=/usr/local/cargo
      # and puts only that on PATH, not `~/.cargo/bin`.
      # `${CARGO_HOME:-$HOME/.cargo}/bin` is where `cargo` actually looks.
      # SPEC-1.10.5: the pinned archive is digest-checked before extraction.
      - name: Cache cargo-audit tarball
        # Version-keyed tarball cache. A hit skips the ~5s download; a
        # version bump misses the key, downloads once, and the sha256 check
        # below is the safety net if a wrong-version file comes back.
        uses: https://github.com/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/cargo-audit.tgz
          key: cargo-audit-tarball-0.22.2-linux

      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: "0.22.2"
          CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
        run: |
          set -euo pipefail
          archive="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz"
          if [ ! -s /tmp/cargo-audit.tgz ]; then
            curl --silent --fail --location --output /tmp/cargo-audit.tgz \
              "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${archive}"
          fi
          echo "${CARGO_AUDIT_SHA256}  /tmp/cargo-audit.tgz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/cargo-audit.tgz --directory /tmp
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "${cargo_bin}"
          install -m 755 "/tmp/cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}/cargo-audit" "${cargo_bin}/cargo-audit"

      # MAPPS-918/MAPPS-976: block the build on any new RUSTSEC advisory
      # against Cargo.lock. The four ignores below are the full backlog from
      # MAPPS-976's triage, each with no fix available:
      #   - RUSTSEC-2024-0436 (paste 1.0.15): unmaintained, last release
      #     (https://github.com/dtolnay/paste/issues/99); desktop-only, via
      #     dioxus-desktop -> image -> rav1e/ravif AVIF encoding.
      #   - RUSTSEC-2024-0370 (proc-macro-error 1.0.4): unmaintained, last
      #     release; desktop-only, via dioxus-desktop's gtk3-macros.
      #   - RUSTSEC-2026-0173 (proc-macro-error2 2.0.1): unmaintained, last
      #     release; compile-time-only, via our own `validator` derive.
      #   - RUSTSEC-2024-0429 (glib 0.18.5): unsound Variant iterator, fixed
      #     only in the breaking glib 0.19+, pinned by dioxus-desktop's
      #     gtk-rs 0.18 chain; our code never calls glib::Variant iteration.
      - name: Audit dependencies
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0173 \
            --ignore RUSTSEC-2024-0429

      # SPEC-1.5.9: report metrics with `if: always()` so an earlier step's failure still reports.
      - name: Report job metrics
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@e728773130496a6e84e0d87de9390f3d98939019 # main

  guards:
    name: bash + nu + just guards
    # Base-medium label: nothing in this job compiles or links. Every step
    # is a bash / nu / just invocation that greps source files, reads
    # manifests, resolves Markdown links, or compares strings; the one
    # cargo call, `cargo update` inside check-types-pin.sh, only resolves
    # the lockfile, and the base image ships cargo for it (as
    # types-pin-drift.yml relies on too). The dev image's compile
    # toolchain would sit idle, so take a base-medium slot and leave
    # BASE_HEAVY for the cargo job above.
    #
    # check-runner-labels.sh validates that the `cargo` job runs on
    # BASE_HEAVY and that no job installs OS packages at run time.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}

    # Backstop, not a target. The guard set is ~38 shell/nu/just
    # invocations that each take seconds; the full job runs in well
    # under a minute on a warm runner.
    # SPEC-1.10.7: bounded job.
    timeout-minutes: 15

    steps:
      - name: Clone the repository
        # `submodules: true` for the justfile guards below: cargo does not need
        # common/, but `import 'common/common.just'` does.
        uses: https://code.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # SPEC-1.8.13: submodules checked out so the common submodule's shared recipes resolve.
          submodules: true

      # scripts/config-docs.nu (MAPPS-1027) reads the release tag list via
      # `git tag --list "v*"`. The Forgejo build of `actions/checkout` honours
      # `fetch-tags: true` only when combined with `fetch-depth: 0`, which
      # pulls full history for a job that never walks `git log`; an explicit
      # one-shot `git fetch --tags` keeps the clone shallow and still populates
      # the tag refs. Without tags the script treats every entry as unreleased
      # and demands every historical release reappear in the Recently-added
      # window.
      # SPEC-1.10.7: shallow tag fetch so config-docs.nu sees release tags.
      - name: Fetch release tags
        run: git fetch --tags --no-recurse-submodules --depth=1

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@e728773130496a6e84e0d87de9390f3d98939019 # main

      # MAPPS-452: a justfile that does not parse takes every recipe and the
      # git hook down with it, and the hook is bypassable with --no-verify, so
      # both guards run here too. `--summary` parses the file and its imports
      # without executing a recipe body.
      - name: Validate the justfile
        run: just --summary

      - name: Check for shadowed common recipes
        run: just check-justfile

      - name: Runner-label guard
        run: |
          bash scripts/check-runner-labels.sh --self-test
          bash scripts/check-runner-labels.sh

      # MAPPS-680: inside a Nushell `$"..."` string every `(` opens a
      # subexpression, so `(MAPPS-421)` in a build-oci-image.yml message ran as
      # an external command and failed the publish job AFTER the image was
      # pushed. `nu --ide-check` parses it clean (the failure is at run time)
      # and the branch that prints it only runs on a branch push, so this guard
      # is the only thing that can see it before a release does.
      - name: Nushell interpolation guard
        run: |
          bash scripts/check-nu-interpolation.sh --self-test
          bash scripts/check-nu-interpolation.sh

      # MAPPS-401: enforce the MAPPS-259 semantic tokens in CI. Without this
      # step the guard only ran locally, and hardcoded grays drifted back in.
      # MAPPS-534: --self-test was on the local recipe and not here, so the
      # guard could have stopped guarding in the one place that gates a merge.
      - name: Theme-token guard
        run: |
          bash scripts/check-theme-tokens.sh --self-test
          bash scripts/check-theme-tokens.sh

      # MAPPS-433: a colour name input.css never defined emits no CSS at all,
      # so the mistake is invisible in the browser and passes the theme-token
      # guard, which hunts the opposite mistake.
      # MAPPS-437: --self-test proves the guard still rejects an undefined name.
      # A guard that silently stopped guarding reports "clean" forever.
      - name: Defined-colour guard
        run: |
          bash scripts/check-defined-colors.sh --self-test
          bash scripts/check-defined-colors.sh

      # MAPPS-423: pin Cancel destinations for shared create/edit forms and
      # keep the base-layer pointer-cursor rule that compensates for Tailwind
      # v4's `button { cursor: default }` preflight.
      - name: Cancel-route and cursor guard
        run: bash scripts/check-cancel-routes.sh

      # MAPPS-432: /auth/callback classifies a failed exchange on the FlowError
      # variant; a string match on the error message must not come back.
      - name: Auth-error-prose guard
        run: bash scripts/check-auth-error-prose.sh

      # MAPPS-436: a Delete/Remove button only opens ConfirmDialog. MAPPS-189
      # wired the dialog app-wide; row Deletes added later shipped with no
      # confirmation at all, so the rule is enforced rather than documented.
      - name: Destructive-confirm guard
        # --self-test first (MAPPS-555): the guard silently reported clean on
        # any file following a raw string with an odd quote count, so a guard
        # that has stopped guarding now fails loudly before it is trusted.
        run: |
          bash scripts/check-confirm-destructive.sh --self-test
          bash scripts/check-confirm-destructive.sh

      # MAPPS-574: a destructive delete that reduces the server's answer to
      # .is_ok() throws away the refusal, so the dialog closes and nothing says
      # why. Eight call sites had it; the reason was devtools-only.
      - name: Delete-result guard
        # --self-test first, so a guard that has stopped guarding fails loudly
        # rather than reporting clean.
        run: |
          bash scripts/check-delete-result.sh --self-test
          bash scripts/check-delete-result.sh

      # MAPPS-446: three class omissions with no effect in the default theme
      # (a heading with no weight, a form grid gated at md:, a name cell with
      # no colour token), so review does not catch them coming back.
      - name: Class-omission guard
        run: bash scripts/check-class-omissions.sh

      # MAPPS-440: no DaisyUI class names, every full-screen auth surface on
      # AuthLayout, and the file-input class recipe only in FileField.
      # MAPPS-534: --self-test, as above.
      - name: Kit-adoption guard
        run: |
          bash scripts/check-kit-adoption.sh --self-test
          bash scripts/check-kit-adoption.sh

      # MAPPS-445: rendered text uses U+2026, never three ASCII periods. The
      # two spellings look alike in a diff, so the ASCII one kept coming back
      # after MAPPS-410 standardized on the glyph. --self-test proves the guard
      # still rejects it.
      - name: Ellipsis-glyph guard
        run: |
          bash scripts/check-ellipsis-glyph.sh --self-test
          bash scripts/check-ellipsis-glyph.sh

      # PMS-1335: no em-dash (U+2014) or en-dash (U+2013) in src/, tests/ or
      # docs/, via the shared `common` guard (MAPPS-1138).
      - name: No-em-dash guard
        shell: nu {0}
        run: |
          just check-em-dash

      # MAPPS-442: every settings list page renders the rich three-part
      # EmptyState with its "New <thing>" button as the CTA. The bare-message
      # mode compiles just as well, so the prose CTA is kept out by the guard.
      - name: Empty-state guard
        run: |
          bash scripts/check-empty-state.sh --self-test
          bash scripts/check-empty-state.sh

      # MAPPS-439: every inline status banner renders StatusBanner, and all
      # four BannerTone recipes stay in components/error_banner.rs. MAPPS-418
      # extracted the red one only, so the other three states drifted into six
      # hand-rolled recipes that all compile and render.
      - name: Status-banner guard
        run: |
          bash scripts/check-status-banner.sh --self-test
          bash scripts/check-status-banner.sh

      # MAPPS-438: a failed list fetch renders ErrorBanner over an empty table.
      # Tickets and Tenants invented rows instead (TKT-1234 / "Acme Corp",
      # four seeded tenants), on a path only a 4xx reaches, so the fabrication
      # never showed up in review or in a normal run.
      - name: Demo-row guard
        run: |
          bash scripts/check-no-demo-rows.sh --self-test
          bash scripts/check-no-demo-rows.sh

      # MAPPS-530: the dev-SSO overlay routes the SPA over TLS, so a plain-http
      # URL baked into it is mixed content the browser blocks. MOKOSH_HUB_BASE_URL
      # was http for two parity audits running; nothing in review catches a scheme.
      - name: dev-SSO scheme guard
        run: |
          bash scripts/check-dev-sso-scheme.sh --self-test
          bash scripts/check-dev-sso-scheme.sh

      # MAPPS-527: the server drops a `?sort=` key it does not allow-list and
      # answers in its default order, so an invented key paints a sorted header
      # over rows that never moved. `company_type`, `company_name` and
      # `-updated_at` all shipped that way and survived three parity audits.
      - name: Sort-key guard
        run: |
          bash scripts/check-sort-keys.sh --self-test
          bash scripts/check-sort-keys.sh

      # MAPPS-528: the server clamps an over-cap `per_page` instead of
      # rejecting it, so a page that asked for 200 got 100 rows and read them
      # as the whole list. Fifteen sites did that, across three parity audits,
      # and nothing in review or in a normal run showed it.
      - name: per_page cap guard
        run: |
          bash scripts/check-per-page-cap.sh --self-test
          bash scripts/check-per-page-cap.sh

      # MAPPS-525: mokosh-types is a bare git dependency with no rev/tag/branch,
      # so the only thing holding it still is the commit Cargo.lock resolved to,
      # and nothing advances that commit. A wire-format change on mokosh-server
      # main therefore never reaches this build: the audits measured the pin 92,
      # then 138, then 214 commits stale while every check stayed green. This
      # step is the gate the shared crate was adopted for. The fix for a red
      # run is `cargo update --package mokosh-types`, reviewed with the diff.
      #
      # MAPPS-537: it fails only when crates/mokosh-types actually differs. A
      # pin that is merely behind passes here and is chased by the weekly
      # types-pin-drift.yml instead, so another repository merging a docs typo
      # can no longer turn a reviewed PR red.
      - name: mokosh-types pin guard
        run: |
          bash scripts/check-types-pin.sh --self-test
          bash scripts/check-types-pin.sh

      # MAPPS-585: a shared field's value must be the `value:` attribute. As a
      # textarea CHILD it is only the DEFAULT value, so the first keystroke
      # dirties the element and every later write lands on textContent instead.
      # That killed the whole Markdown toolbar for anyone who had typed.
      - name: Field value-binding guard
        run: |
          bash scripts/check-field-value-binding.sh --self-test
          bash scripts/check-field-value-binding.sh
          bash scripts/check-hooks-before-return.sh --self-test
          bash scripts/check-hooks-before-return.sh

      # MAPPS-1211: `SurfaceVisibility::StaffAdmin` is a hub-visibility flag and
      # nothing else. The route stays reachable, so Settings > Contact Roles
      # showed a non-admin the whole capability editor to anybody who typed the
      # URL. Nothing in the types joins the registry's data to the page's
      # control flow, which is why a script holds it.
      # SPEC-2.10.1: the admin-gate guard runs self-test first, then for real.
      - name: Admin-gate guard
        run: |
          bash scripts/check-admin-gate.sh --self-test
          bash scripts/check-admin-gate.sh

      # MAPPS-1212: the browser toggles a checkbox's own node on click, and
      # dioxus does not mark `checked` volatile, so a re-render computing the
      # same value emits nothing and a cancelled turn-off leaves the box
      # showing a value nothing wrote. Two pages shipped that way, one with a
      # comment claiming a server re-read would fix it.
      # SPEC-2.11.1: the confirmed-toggle guard runs self-test first, then for real.
      - name: Confirmed-toggle guard
        run: |
          bash scripts/check-confirmed-toggle.sh --self-test
          bash scripts/check-confirmed-toggle.sh

      # MAPPS-659: the pre-hydration theme applier read `localStorage.theme`
      # while the app has always written `mokosh_theme`, so it never found a
      # stored preference and every load painted its first frame from the OS
      # match. The two names sit in different languages and no test read both.
      - name: Theme storage-key guard
        run: |
          bash scripts/check-theme-storage-key.sh --self-test
          bash scripts/check-theme-storage-key.sh

      # MAPPS-970: auto-hiding scrollbars. A global `scrollbar-color` made Chromium drop every
      # webkit rule, and `scrollbar-hide` left the sidebar with no bar to grab.
      - name: Scrollbar guard
        run: |
          bash scripts/check-scrollbars.sh --self-test
          bash scripts/check-scrollbars.sh

      # MAPPS-917: the portal and contact refresh tokens stay out of localStorage.
      - name: Refresh-token storage guard
        run: |
          bash scripts/check-refresh-token-storage.sh --self-test
          bash scripts/check-refresh-token-storage.sh

      # MAPPS-624: the width cap lives on each route component, not on AppShell.
      # Putting a max-w back on the shell re-caps the page that opted out, and a
      # route added without its own wrapper is full width by accident.
      - name: Page-width guard
        run: |
          bash scripts/check-page-width.sh --self-test
          bash scripts/check-page-width.sh

      # MAPPS-695: every page awaited a fetch and ended in `.ok()`, so a 401, a
      # 500, a decode mismatch and a genuinely empty tenant all reached the card
      # as the same `None` with nothing in the console to tell them apart.
      - name: Fetch error-logging guard
        run: |
          bash scripts/check-fetch-error-logging.sh --self-test
          bash scripts/check-fetch-error-logging.sh

      # MAPPS-789: a busy surface renders TableLoading or DetailSkeleton, never
      # a hand-rolled "Loading…" string. Fourth report of the class, and the
      # copied shape kept regrowing between audits, so the guard runs here too.
      - name: Loading-skeleton guard
        run: |
          bash scripts/check-loading-recipe.sh --self-test
          bash scripts/check-loading-recipe.sh

      # MAPPS-584: @tailwindcss/typography writes .prose into `@layer utilities`
      # and the MAPPS-573 corrections were written into `@layer components`, so
      # the plugin won every declaration the two shared and the whole block
      # shipped inert. Nothing caught it because MAPPS-573's tests cover the
      # Rust renderer and the stylesheet had none.
      - name: Prose cascade-layer guard
        run: |
          bash scripts/check-prose-layer.sh --self-test
          bash scripts/check-prose-layer.sh

      # MAPPS-534: a send button carries a MailIcon, a send action goes through
      # EmailPreview, and every listed path still has a caller. This ran only
      # in `just check` until now, so a PR that broke it merged green.
      - name: Email-affordance guard
        run: |
          bash scripts/check-email-affordance.sh --self-test
          bash scripts/check-email-affordance.sh

      # MAPPS-545: every relative Markdown link resolves. MAPPS-540 found 49
      # that did not, all of them from a file move that left the links inside
      # a relocated directory one level short. Nothing had caught them because
      # a broken link fails silently: three doc audits reported stale content
      # in those files without noticing the links underneath were dead.
      - name: Markdown link targets
        run: |
          bash scripts/check-doc-links.sh --self-test
          bash scripts/check-doc-links.sh

      # MAPPS-534: the guard over this file. Every command in a `just check`
      # recipe must appear in a `run:` block here, so the next guard added
      # cannot be added to one of the two places and not the other. It compares
      # command lines rather than recipe names, because two of the four drifts
      # it was written for were steps present but invoked without --self-test.
      - name: CI-parity guard
        run: |
          bash scripts/check-ci-parity.sh --self-test
          bash scripts/check-ci-parity.sh

      # MAPPS-1027: fails if docs/configuration.md disagrees with
      # config/variables.toml or with the `${MOKOSH_...}` reads in
      # oci-build/entrypoint.sh. Self-test first (same shape as
      # check-link-preview), so a guard that stopped guarding fails
      # loudly.
      - name: Configuration docs
        shell: nu {0}
        run: |
          nu scripts/config-docs.nu self-test
          nu scripts/config-docs.nu check

      # MAPPS-650 / PMS-946: David asked the user-facing identifier read
      # "Company ID", not "Portal ID". Grep the contact-plane pages for
      # a regression: if a fresh string lands under
      # src/pages/contact_portal/ that says "Portal ID", fail the PR.
      # Scope is narrow on purpose - `portal_id` is the wire/schema
      # field name and legitimately appears in comments elsewhere in
      # src/. Only the customer-facing surface is guarded.
      - name: Company ID copy guard
        run: just check-company-id-copy

      # MAPPS-967: a Card's heading is its `title` prop. 22 cards wrote their own
      # `h2`/`h3` inside the body instead, so the app carried two heading styles
      # that differ in size, weight and inset, and both compile and render.
      - name: Card-heading guard
        run: |
          bash scripts/check-card-headings.sh --self-test
          bash scripts/check-card-headings.sh

      # SPEC-1.5.9: report metrics with `if: always()` so an earlier step's failure still reports.
      - name: Report job metrics
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@e728773130496a6e84e0d87de9390f3d98939019 # main

  secrets:
    # Base image, medium size: the scanners read the tree and compile nothing.
    # Explicit runs-on here because a cross-repo reusable `uses:` on this
    # Forgejo instance does not resolve the caller's `vars.*`, so the runner
    # wait message comes back with empty labels. Shaped like bunyip's secrets
    # job (BUNYIP-786): the composite action runs as named steps of this job,
    # a failing scanner is named in the UI, and the URL-form stops Renovate's
    # github-actions manager from treating `psa-systems/common` as github.com.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    defaults:
      run:
        shell: nu {0}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # SPEC-1.4.13: every push and pull request is scanned for committed secrets.
      - name: Secrets scan
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/check-secrets@7987236da3d1a4aee8897ecd9e2be16e6d5b65ac # main
        with:
          # Nosey Parker's Generic Secret rule flags the 40-character commit
          # SHA the composite action is pinned to above (MAPPS-954): a SHA
          # pin isn't a credential, so suppress this one finding by id
          # rather than reverting the pin.
          # SPEC-1.11.4: the path allow-list lives in .noseyparker-ignore.txt.
          noseyparker_findings_exclude: 5ea6a266e38a359ff88be14c9235d517260ad043
