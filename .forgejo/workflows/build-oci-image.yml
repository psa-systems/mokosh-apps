---

# Build OCI image and push to Forgejo Container Registry.
name: Build OCI container

on:
  push:
    branches:
      # TEMPORARY: `main` disabled while mokosh-contact-login is the only
      # staging build. Uncomment to restore `:latest` from main. Flip this
      # together with the matching mokosh-server workflow.
      #- "main"
      # Branch publish allow-list (MAPPS-421). A push to a branch named here
      # publishes ONLY a tag derived from the branch name, so staging can run a
      # feature branch while `:latest` stays reachable from main alone. This
      # list IS the allow-list: any other branch never triggers the workflow,
      # so it publishes nothing. Retire an entry when its branch merges.
      - "mokosh-contact-login"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "assets/**"
      - "input.css"
      - "index.html"
      - "Dioxus.toml"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - "oci-build/**"
      - ".forgejo/workflows/build-oci-image.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, compute tags and print every registry action without pushing"
        type: boolean
        default: true
      simulate_tag:
        description: "Version like v9.9.9 to exercise the release publish path; empty exercises latest"
        type: string
        default: ""

jobs:
  build-and-push:
    name: Build and push mokosh-www image
    # Base label: every compile happens inside buildx containers, so the runner
    # only needs docker and never links on the host.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ""
      REGISTRY_PROVIDER: dev.a8n.run
      REGISTRY_OWNER: ${{ vars.PSA_SYSTEMS_PRIVATE_PACKAGE_OWNER }}
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}
      # Self-host mirror: when the public owner var is set, every
      # private push is mirrored to dev.a8n.run/<public-owner>/mokosh-www
      # so self-hosters can pull without registry credentials. Leave
      # the var unset to skip the mirror step (e.g. before ops has
      # created the public package owner).
      #
      # The mirror uses the same PSA_SYSTEMS_PRIVATE_PACKAGE_PAT for
      # both ends because Forgejo's docker login keys auth by host
      # (`dev.a8n.run`), so two logins to the same host clobber each
      # other's entries in ~/.docker/config.json. The PAT therefore
      # must be granted write access to *both* the private and the
      # public package owners. If a future Forgejo extension makes
      # per-package-scoped auth possible we can split this back into
      # two creds and use DOCKER_CONFIG to keep them separate.
      PUBLIC_REGISTRY_OWNER: ${{ vars.PSA_SYSTEMS_PUBLIC_PACKAGE_OWNER }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Set up QEMU for cross-arch emulation
        # Register both amd64 and arm64 binfmt handlers via the
        # privileged tonistiigi/binfmt container directly, rather
        # than via setup-qemu-action@v3. The action wants to cache
        # the binfmt image at the GitHub-Actions tool cache path
        # ($RUNNER_TOOL_CACHE, default /opt/hostedtoolcache); on the
        # Forgejo runner that path is not writable and the step dies
        # with `EACCES: permission denied, mkdir '/opt/hostedtoolcache'`.
        # The direct privileged docker run is what the action does
        # under the hood, minus the broken cache step.
        # The list is deliberately symmetric so this works on either
        # host arch without follow-up edits.
        run: |
          docker run --privileged --rm tonistiigi/binfmt:latest --install amd64,arm64

      - name: Set up buildx builder
        run: |
          docker buildx create --name container-builder --driver docker-container --use

      - name: Set environment variables
        shell: nu {0}
        run: |
          let owner = $env.REGISTRY_OWNER
          $"REGISTRY_USER=($owner)\n" | save --append $env.GITHUB_ENV
          $"IMAGE_REGISTRY=($env.REGISTRY_PROVIDER)/($owner)\n" | save --append $env.GITHUB_ENV

      - name: Resolve publish mode, train and tag
        id: resolve
        shell: nu {0}
        run: |
          # Derive the publish mode from the trigger, never from git describe:
          # a tag ref -> release (push :vX.Y.Z only), a main push -> latest
          # (push :latest only), a push to an allow-listed branch -> branch
          # (push :<branch> only, MAPPS-421), a manual run -> dry-run. A release
          # commit fires BOTH the main-push and the tag-push events; resolving
          # disjoint tags per trigger is what stops the two runs from racing to
          # overwrite the same :latest tag (governance GOV-13).
          let event = "${{ github.event_name }}"
          let ref_type = "${{ github.ref_type }}"
          let ref_name = "${{ github.ref_name }}"
          let simulate_tag = "${{ inputs.simulate_tag }}"
          let mode = if $event == "workflow_dispatch" {
            "dry-run"
          } else if $ref_type == "tag" {
            "release"
          } else if $ref_name == "main" {
            "latest"
          } else {
            # Only the branches in the `on: push: branches:` allow-list above can
            # reach this arm; any other branch never triggers the workflow.
            "branch"
          }
          # A manual run only mutates the registry if dry_run is explicitly false;
          # the input defaults to true, and push events always publish for real.
          let dry_run = ($event == "workflow_dispatch" and "${{ inputs.dry_run }}" != "false")
          # A manual run resolves the latest (or simulated release) train, so
          # letting one publish for real from a feature branch would write
          # :latest from unmerged code. Refuse it loudly: publish a branch by
          # pushing the branch, which resolves the branch train instead.
          if $event == "workflow_dispatch" and (not $dry_run) and $ref_type != "tag" and $ref_name != "main" {
            error make { msg: $"A workflow_dispatch with dry_run=false is only allowed on main or a v* tag, not on '($ref_name)': it would publish :latest from unmerged code. Push the branch instead to publish its branch tag." }
          }
          let r = (^nu oci-build/get-tags.nu --mode $mode --ref-name $ref_name --simulate-tag $simulate_tag --json | from json)
          $"mode=($r.mode)\n" | save --append $env.GITHUB_OUTPUT
          $"train=($r.train)\n" | save --append $env.GITHUB_OUTPUT
          $"tag=($r.tag)\n" | save --append $env.GITHUB_OUTPUT
          $"describe=($r.describe)\n" | save --append $env.GITHUB_OUTPUT
          $"dry_run=($dry_run)\n" | save --append $env.GITHUB_OUTPUT
          print $"mode=($r.mode) train=($r.train) tag=($r.tag) describe=($r.describe) dry_run=($dry_run)"

      - name: Log in to container registry
        shell: nu {0}
        run: |
          ^docker login --username $env.REGISTRY_USER --password $env.REGISTRY_PASSWORD $env.REGISTRY_PROVIDER

      - name: Export Actions runtime env for buildx gha cache
        # A raw `docker buildx build` (unlike docker/build-push-action)
        # does not auto-inject the gha cache backend's env, and
        # ACTIONS_RUNTIME_TOKEN is masked from run: steps. This action
        # re-exports ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN into
        # GITHUB_ENV so the build step's `type=gha` cache can reach
        # act_runner's cache server (needs runner cache.enabled: true).
        uses: https://github.com/crazy-max/ghaction-github-runtime@v3

      - name: Build and push mokosh-www image
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let image = "mokosh-www"
          let registry = $env.IMAGE_REGISTRY
          let tag_args = [-t $"($registry)/($image):($tag)"]
          # Cache to act_runner's built-in Actions cache server (type=gha),
          # not the registry. The dev.a8n.run registry cache-export PUT
          # stalled indefinitely with no error (MAPPS-131 hung the job ~3h),
          # which is why cache-to used to be split into a best-effort step.
          # The gha backend talks to the on-LAN cache server (cache.enabled),
          # keyed by ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN exported by the
          # step above, so the export is fast and inline again. mode=max keeps
          # every intermediate layer; ignore-error keeps a cache hiccup (or a
          # disabled runner cache) from failing an otherwise-green build.
          let cache_from = "type=gha"
          let cache_to = "type=gha,mode=max,ignore-error=true"
          # A dry-run builds locally (--load) and writes neither the registry
          # nor the cache; a real run pushes and exports the cache.
          let push_args = if $dry_run { [--load] } else { [--push --cache-to $cache_to] }
          # CARGO_BUILD_JOBS caps cargo's parallel rustc + build-script
          # workers. This is the only build on the runner, so use the
          # full host nproc.
          let jobs = (sys cpu | length)
          print $"CARGO_BUILD_JOBS=($jobs)"
          let action = if $dry_run { "[dry-run] WOULD build and push" } else { "Building and pushing" }
          print $"($action) ($image):($tag)"
          # WASM bundle is arch-agnostic, so the builder stage is
          # pinned to BUILDPLATFORM in the Dockerfile (compiles once
          # on the runner's native arch). Only the Caddy-on-alpine
          # runtime stage is rebuilt per target arch from a multi-arch
          # base, so adding arm64 here is cheap.
          (
            ^docker buildx build
              ...$push_args
              --platform linux/amd64,linux/arm64
              --cache-from $cache_from
              --build-arg $"GIT_SHA=($env.GITHUB_SHA)"
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
              ...$tag_args
              -f oci-build/Dockerfile
              .
          )

      - name: Mirror image to public registry
        # MAPPS-421: a branch tag is a staging-only artifact, so it is never
        # mirrored. The public owner carries main and release tags only.
        if: vars.PSA_SYSTEMS_PUBLIC_PACKAGE_OWNER != '' && steps.resolve.outputs.train != 'branch'
        shell: nu {0}
        run: |
          # Copy each tag's manifest list (multi-arch preserved) from
          # the private package to the public one. `buildx imagetools
          # create` rewrites the manifest reference without rebuilding
          # the underlying layers, so this step is fast and cannot
          # drift from the source image.
          #
          # Auth: the docker login from the earlier "Log in to
          # container registry" step is still in effect (this step
          # does NOT re-login, which would clobber it for the SAME
          # registry host). The same PAT must hold read on the
          # private package and write on the public package - see
          # the comment on PUBLIC_REGISTRY_OWNER in env: above.
          let tag = "${{ steps.resolve.outputs.tag }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let public_reg = $"($env.REGISTRY_PROVIDER)/($env.PUBLIC_REGISTRY_OWNER)"
          let image = "mokosh-www"
          let private_reg = $env.IMAGE_REGISTRY
          if $dry_run {
            print $"[dry-run] WOULD mirror ($image):($tag) -> ($public_reg)/($image):($tag)"
          } else {
            print $"Mirroring ($image):($tag) -> ($public_reg)/($image):($tag)"
            ^docker buildx imagetools create --tag $"($public_reg)/($image):($tag)" $"($private_reg)/($image):($tag)"
          }

      - name: Warn if the public mirror was skipped
        # PSA-58: the mirror step above is gated on
        # PSA_SYSTEMS_PUBLIC_PACKAGE_OWNER, so when that var is unset the step is
        # SKIPPED and the job still goes green - the public `:latest` then
        # silently freezes while private builds keep succeeding (this is how the
        # public path drifted stale, noticed during PMS-687). Make the skip loud
        # on a real (non-dry-run) push so it is a deliberate choice, not a silent
        # gap. `::warning` surfaces as a run annotation; it does not fail the
        # build, because an intentionally-unset owner (no public image yet) is a
        # valid config.
        # MAPPS-421: a branch build is never mirrored by design, so it gets the
        # explicit line in "Print image URLs" instead of this warning.
        if: vars.PSA_SYSTEMS_PUBLIC_PACKAGE_OWNER == '' && steps.resolve.outputs.dry_run == 'false' && steps.resolve.outputs.train != 'branch'
        run: |
          echo "::warning title=Public mirror skipped::PSA_SYSTEMS_PUBLIC_PACKAGE_OWNER is empty, so mokosh-www:${{ steps.resolve.outputs.tag }} was NOT mirrored to the public registry. Set the var to publish a public image, or leave it unset intentionally if no public mirror is wanted."

      - name: Print image URLs
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let train = "${{ steps.resolve.outputs.train }}"
          let dry_run = ("${{ steps.resolve.outputs.dry_run }}" == "true")
          let prefix = if $dry_run { "[dry-run] WOULD push image to" } else { "Image pushed to" }
          let image = "mokosh-www"
          let registry = $env.IMAGE_REGISTRY
          print $"($prefix) ($registry)/($image):($tag)"
          if $train == "branch" {
            print $"Branch build: ($image):($tag) is a staging-only artifact, so it was NOT mirrored to the public registry (MAPPS-421)."
          } else if ($env.PUBLIC_REGISTRY_OWNER | is-not-empty) {
            let public_reg = $"($env.REGISTRY_PROVIDER)/($env.PUBLIC_REGISTRY_OWNER)"
            let mirror_prefix = if $dry_run { "[dry-run] WOULD mirror image to" } else { "Image mirrored to" }
            print $"($mirror_prefix) ($public_reg)/($image):($tag)"
          }
