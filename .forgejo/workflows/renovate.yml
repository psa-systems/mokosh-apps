---

# Thin caller for the reusable Renovate workflow in psa-systems/common
# (feat/renovate-reusable-workflow, PC-91 follow-up). The definition
# lives there; this stub owns the schedule for THIS repo so an operator
# changing mokosh-apps's cadence does not have to touch common.
#
# Renovate scans the tree against `renovate.json` at the repo root and
# opens PRs grouped by family (dioxus, mokosh-types pin, ...).
# The org-level `RENOVATE_CI_TOKEN` secret is passed explicitly under the
# name the reusable workflow reads; the token has `write:repository` +
# `write:issue` scope.

name: Renovate

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate (caller)
    uses: psa-systems/common/.forgejo/workflows/renovate-reusable.yml@1f4d449a32d694f229b112a3f6a651534660cf55 # main
    with:
      target_repository: ${{ github.repository }}
    secrets:
      # secret-scope-ok: reusable workflow reads RENOVATE_CI_TOKEN (write:repository + write:issue) to open dependency-update PRs; this caller job runs no step and reads no secret itself. Explicit pass-through, not `secrets: inherit`, so the callee gets only this secret.
      RENOVATE_CI_TOKEN: ${{ secrets.RENOVATE_CI_TOKEN }}
